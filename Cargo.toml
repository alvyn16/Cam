[package]
name = "cam"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Fast native Windows screen recorder and video studio"
default-run = "cam"

[lib]
name = "cam"
path = "src/lib.rs"

[[bin]]
name = "cam"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = "0.36"
wgpu = "30"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
gif = "0.14"
color_quant = "1.1"
ab_glyph = "0.2"
cpal = "0.18"
arboard = "3"
whisper-rs = { version = "0.16" }
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_Security",
    "Win32_Storage_Xps",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Foundation",
] }
nnnoiseless = { version = "0.5.2", default-features = false }
windows-capture = "2.0.1"
windows-core = "0.58"
windows62 = { package = "windows", version = "0.62", features = ["Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Direct3D10", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects"] }

[build-dependencies]
winres = "0.1.12"
